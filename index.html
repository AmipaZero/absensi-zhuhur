
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Siswa | SMK Farmasi Bhakti Kencana</title>

  <style>
    :root {
      --navy: #12304a;
      --blue: #1769aa;
      --orange: #f28c28;
      --bg: #f4f7fb;
      --white: #ffffff;
      --text: #263746;
      --muted: #718096;
      --border: #e2e8f0;
      --green: #15803d;
      --red: #b91c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 22px 6%;
      border-bottom: 4px solid var(--orange);
    }

    header h1 {
      font-size: 23px;
      margin-bottom: 4px;
    }

    header p {
      color: #dbeafe;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h2 {
      font-size: 25px;
      color: var(--navy);
      margin-bottom: 5px;
    }

    .page-title p {
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    input {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    input:focus {
      border-color: var(--blue);
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-orange {
      background: var(--orange);
      color: white;
    }

    .summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 18px 20px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 9px;
      margin-bottom: 20px;
    }

    .summary strong {
      display: block;
      font-size: 25px;
      color: var(--navy);
    }

    .summary span {
      color: var(--muted);
      font-size: 13px;
    }

    .status {
      font-size: 13px;
      padding: 7px 11px;
      border-radius: 6px;
      background: #eff6ff;
      color: var(--blue);
    }

    .table-container {
      overflow-x: auto;
      background: white;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th, td {
      text-align: left;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    th {
      background: #edf3f8;
      color: var(--navy);
      font-size: 13px;
    }

    tbody tr:hover {
      background: #f8fafc;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px;
    }

    .message {
      margin-bottom: 15px;
      padding: 12px 14px;
      border-radius: 7px;
      font-size: 14px;
      display: none;
      overflow-wrap: anywhere;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: var(--red);
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: var(--green);
    }

    footer {
      text-align: center;
      color: var(--muted);
      padding: 25px 15px;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 19px;
      }

      .page-title h2 {
        font-size: 22px;
      }

      main {
        margin-top: 22px;
        padding: 0 12px;
      }

      .toolbar button {
        flex: 1;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>SMK FARMASI BHAKTI KENCANA</h1>
    <p>Sistem Informasi Sekolah · Database Siswa</p>
  </header>

  <main>
    <section class="page-title">
      <h2>Data Siswa</h2>
      <p>Informasi siswa yang tersimpan di database sekolah.</p>
    </section>

    <div id="message" class="message"></div>

    <section class="toolbar">
      <input
        type="search"
        id="searchInput"
        placeholder="Cari ID, nama, username, atau kelas..."
        aria-label="Cari data siswa"
      >
      <button class="btn-primary" id="refreshButton">
        Muat Ulang Data
      </button>
    </section>

    <section class="summary">
      <div>
        <strong id="totalSiswa">0</strong>
        <span>Total siswa ditemukan</span>
      </div>
      <div id="connectionStatus" class="status">
        Menghubungkan...
      </div>
    </section>

    <section class="table-container">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>ID Siswa</th>
            <th>Nama</th>
            <th>Username</th>
            <th>Kelas</th>
          </tr>
        </thead>
        <tbody id="studentTable">
          <tr>
            <td colspan="5" class="empty">Memuat data siswa...</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    © 2026 SMK Farmasi Bhakti Kencana
  </footer>

  <script>
    // Ganti dengan URL Web App Apps Script milik lu.
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxDVHcWgNNu_xgvq7ujaFkh69-ZNaqnS4ea4GWM_LtO3rIlSXJMa2h0DCDKjPOpB9nN5g/exec";

    // Sesuaikan dengan API_KEY di Code.gs.
    const API_KEY = "rahasia";

    let allStudents = [];

    const tableBody = document.getElementById("studentTable");
    const searchInput = document.getElementById("searchInput");
    const totalSiswa = document.getElementById("totalSiswa");
    const connectionStatus = document.getElementById("connectionStatus");
    const messageBox = document.getElementById("message");

    function showMessage(text, type) {
      messageBox.textContent = text;
      messageBox.className = "message " + type;
    }

    function hideMessage() {
      messageBox.textContent = "";
      messageBox.className = "message";
    }

    function getValue(student, keys) {
      for (const key of keys) {
        if (student[key] !== undefined && student[key] !== null) {
          return student[key];
        }
      }
      return "";
    }

    function renderStudents() {
      const keyword = searchInput.value.trim().toLowerCase();

      const filtered = allStudents.filter(student => {
        const id = getValue(student, ["ID", "id", "id_siswa"]);
        const nama = getValue(student, ["Nama", "nama", "nama_siswa"]);
        const username = getValue(student, ["Username", "username"]);
        const kelas = getValue(student, ["Kelas", "kelas"]);

        return [id, nama, username, kelas].some(value =>
          String(value).toLowerCase().includes(keyword)
        );
      });

      totalSiswa.textContent = filtered.length;

      if (filtered.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">
              Tidak ada data siswa yang cocok.
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = "";

      filtered.forEach((student, index) => {
        const tr = document.createElement("tr");

        const values = [
          index + 1,
          getValue(student, ["ID", "id", "id_siswa"]),
          getValue(student, ["Nama", "nama", "nama_siswa"]),
          getValue(student, ["Username", "username"]),
          getValue(student, ["Kelas", "kelas"])
        ];

        values.forEach(value => {
          const td = document.createElement("td");
          td.textContent = String(value);
          tr.appendChild(td);
        });

        tableBody.appendChild(tr);
      });
    }

    async function loadStudents() {
      connectionStatus.textContent = "Menghubungkan...";
      hideMessage();

      tableBody.innerHTML = `
        <tr>
          <td colspan="5" class="empty">Memuat data siswa...</td>
        </tr>
      `;

      try {
        const url = new URL(API_URL);
        url.searchParams.set("action", "list");
        url.searchParams.set("key", API_KEY);

        const response = await fetch(url.toString(), {
          method: "GET",
          redirect: "follow"
        });

        if (!response.ok) {
          throw new Error("Server mengembalikan HTTP " + response.status);
        }

        const result = await response.json();

        if (result.success === false) {
          throw new Error(result.message || "Gagal mengambil data siswa.");
        }

        let students;

        if (Array.isArray(result)) {
          students = result;
        } else {
          students =
            result.data ||
            result.siswa ||
            result.students ||
            result.rows;

          if (!Array.isArray(students)) {
            throw new Error(
              "Format respons API belum sesuai. Periksa hasil JSON action=list."
            );
          }
        }

        allStudents = students;
        renderStudents();

        connectionStatus.textContent = "Terhubung";
        hideMessage();

      } catch (error) {
        connectionStatus.textContent = "Gagal terhubung";
        totalSiswa.textContent = "0";

        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="empty">
              Data siswa belum dapat ditampilkan.
            </td>
          </tr>
        `;

        showMessage(
          "Gagal memuat data: " + error.message +
          ". Periksa URL Apps Script, API key, format JSON, dan izin akses Web App.",
          "error"
        );

        console.error("Kesalahan memuat siswa:", error);
      }
    }

    searchInput.addEventListener("input", renderStudents);
    document.getElementById("refreshButton")
      .addEventListener("click", loadStudents);

    loadStudents();
  </script>
</body>
</html>
