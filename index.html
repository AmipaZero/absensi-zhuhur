
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Siswa | SMK Farmasi Bhakti Kencana</title>
  <style>
    :root {
      --orange: #ed7d16;
      --orange-dark: #c65d08;
      --yellow: #fff0c2;
      --ink: #243247;
      --muted: #687386;
      --line: #e5e7eb;
      --bg: #f7f8fa;
      --white: #fff;
      --green: #18794e;
      --red: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      background: var(--white);
      border-bottom: 4px solid var(--orange);
      padding: 23px 5%;
    }

    .brand {
      max-width: 1150px;
      margin: auto;
    }

    .eyebrow {
      color: var(--orange-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 6px;
      font-size: clamp(23px, 4vw, 34px);
    }

    header p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    main {
      max-width: 1150px;
      margin: 28px auto;
      padding: 0 20px 40px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .count {
      color: var(--muted);
      font-size: 14px;
    }

    .actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 15px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .primary {
      color: white;
      background: var(--orange);
    }

    .primary:hover { background: var(--orange-dark); }

    .secondary {
      background: white;
      border: 1px solid var(--line);
      color: var(--ink);
    }

    .danger {
      color: var(--red);
      background: #fff0ef;
    }

    .table-wrap {
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 15px 16px;
      text-align: left;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    th {
      background: var(--yellow);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    tr:last-child td { border-bottom: 0; }

    .row-actions {
      display: flex;
      gap: 7px;
    }

    .small {
      padding: 8px 10px;
      font-size: 12px;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: var(--muted);
    }

    .search {
      width: 100%;
      max-width: 360px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      outline-color: var(--orange);
      background: white;
    }

    .notice {
      display: none;
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 17px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice.show { display: block; }
    .notice.info { background: #eef5ff; color: #174ea6; }
    .notice.success { background: #eaf7ef; color: var(--green); }
    .notice.error { background: #fff0ef; color: var(--red); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 45, .55);
      z-index: 10;
      padding: 18px;
      align-items: center;
      justify-content: center;
      overflow: auto;
    }

    .modal.open { display: flex; }

    .dialog {
      background: white;
      width: 100%;
      max-width: 500px;
      border-radius: 14px;
      padding: 25px;
      max-height: 95vh;
      overflow-y: auto;
    }

    .dialog h2 { margin: 0 0 7px; }

    .dialog .hint {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .field { margin-bottom: 15px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d5d9e0;
      border-radius: 8px;
      font: inherit;
      background: white;
    }

    input:focus, select:focus {
      outline: 2px solid #ffdbad;
      border-color: var(--orange);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 22px;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 600px) {
      main { padding: 0 12px 28px; margin-top: 20px; }
      header { padding: 20px 16px; }
      .toolbar { align-items: stretch; }
      .toolbar .actions { width: 100%; }
      .toolbar .actions button { flex: 1; }
      .search { max-width: none; }
      .dialog { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="eyebrow">Sistem Informasi Sekolah</div>
      <h1>Data Siswa</h1>
      <p>SMK Farmasi Bhakti Kencana · Pengelolaan data siswa</p>
    </div>
  </header>

  <main>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>

    <div class="toolbar">
      <div>
        <strong>Daftar siswa</strong>
        <div class="count" id="count">Memuat data...</div>
      </div>
      <div class="actions">
        <button class="secondary" id="refreshBtn" type="button"
          onclick="loadStudents()">Muat ulang</button>
        <button class="primary" id="addBtn" type="button"
          onclick="openForm()">+ Tambah siswa</button>
      </div>
    </div>

    <div style="margin-bottom:15px">
      <input class="search" id="search" type="search"
        placeholder="Cari nama, username, atau kelas..."
        aria-label="Cari siswa">
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No.</th>
            <th>Nama siswa</th>
            <th>Username</th>
            <th>Kelas</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="studentRows">
          <tr><td colspan="5" class="empty">Menghubungkan ke database...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>SMK Farmasi Bhakti Kencana · Data dikelola melalui Google Sheets</footer>


</body>
</html>
